<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Entrar — Tetra{% endblock %}</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.bunny.net/css?family=big-shoulders-display:400,700,800,900|sora:400,500,600|ibm-plex-mono:400,500,600&display=swap">
    <link href="/static/css/app.css" rel="stylesheet">
</head>
<body>
    <div class="wall">
        <a href="#main" class="skip-link">Saltar al contenido</a>
        <div class="auth-shell">
            <!-- Left Brand & Showcase Pane -->
            <aside class="auth-showcase">
                <a class="auth-brand" href="/" aria-label="Volver a la página principal de Tetra">
                    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <polygon points="20,3 3,28 20,37" fill="#f1ead6" />
                        <polygon points="20,3 37,28 20,37" fill="#e0a020" />
                    </svg>
                    Tetra
                </a>

                <div>
                    <p class="auth-declaration">La factura que <em>se diseña</em>.<br>No la que <span class="strike">se sufre</span>.</p>

                    <ul class="auth-features" style="margin-top: 2rem;">
                        <li>Código abierto</li>
                        <li>Self-hosted</li>
                        <li>SENIAT · IVA · IGTF</li>
                        <li>VES + USD</li>
                    </ul>
                </div>

                <div class="auth-foot">Hecho para PyMEs venezolanas</div>
            </aside>

            <!-- Right Form Pane -->
            <main class="auth-form-pane" id="main">
                <a class="auth-brand auth-mobile-brand" href="/" aria-label="Volver a la página principal de Tetra">
                    <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <polygon points="20,3 3,28 20,37" fill="#f1ead6" />
                        <polygon points="20,3 37,28 20,37" fill="#e0a020" />
                    </svg>
                    Tetra
                </a>
                <div class="auth-card">
                    {% block auth_content %}{% endblock %}
                </div>
            </main>
        </div>
    </div>
    <script src="/static/js/app.js"></script>
</body>
</html>
