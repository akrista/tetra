<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetra</title>
    <style>
        body { margin: 0; padding: 0; background: #0e0e10; font-family: Sora, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #141414; }
        .container { max-width: 32rem; margin: 0 auto; padding: 2rem 1.5rem; }
        .card { background: #f1ead6; border: 1px solid rgba(14,14,16,.2); padding: 2rem; }
        .brand { font-family: "Big Shoulders Display", Sora, sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1.25rem; letter-spacing: .02em; color: #141414; margin: 0 0 1.25rem; }
        .brand .amber { color: #b87a10; }
        h1 { font-family: "Big Shoulders Display", Sora, sans-serif; font-size: 1.5rem; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; margin: 0 0 1rem; color: #141414; }
        p { margin: 0 0 1rem; line-height: 1.55; color: #141414; }
        .muted { color: rgba(14,14,16,.62); font-size: .9rem; }
        .btn { display: inline-block; background: #e0a020; color: #141414 !important; padding: .75rem 1.5rem; text-decoration: none; font-weight: 600; font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; border: 1.5px solid #141414; }
        .url { word-break: break-all; color: #b87a10; font-size: .85rem; }
        .footer { margin-top: 2rem; color: rgba(241,234,214,.62); font-size: .8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p class="brand">Tetra<span class="amber">.</span></p>
            {% block email_content %}{% endblock %}
        </div>
        <p class="footer">Tetra &middot; Hecho para PyMEs venezolanas</p>
    </div>
</body>
</html>
