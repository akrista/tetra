<!DOCTYPE html>
<html lang="es-VE">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetra</title>
    <style>
        body { margin: 0; padding: 0; background: #0b100d; font-family: Sora, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #16231b; }
        .container { max-width: 32rem; margin: 0 auto; padding: 2rem 1.5rem; }
        .card { background: #f3f6f1; border: 1px solid rgba(11,16,13,.2); border-radius: 12px; padding: 2rem; }
        .brand { font-family: Sora, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 1.25rem; letter-spacing: -.01em; color: #16231b; margin: 0 0 1.25rem; }
        .brand .accent { color: #1d6e42; }
        h1 { font-family: Sora, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; margin: 0 0 1rem; color: #16231b; }
        p { margin: 0 0 1rem; line-height: 1.55; color: #16231b; }
        .muted { color: rgba(22,35,27,.62); font-size: .9rem; }
        .btn { display: inline-block; background: #1d6e42; color: #ffffff !important; padding: .75rem 1.5rem; text-decoration: none; font-weight: 600; font-size: .9rem; text-transform: uppercase; letter-spacing: .08em; border-radius: 8px; }
        .url { word-break: break-all; color: #1d6e42; font-size: .85rem; }
        .footer { margin-top: 2rem; color: rgba(243,246,241,.6); font-size: .8rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <p class="brand">Tetra<span class="accent">.</span></p>
            {% block email_content %}{% endblock %}
        </div>
        <p class="footer">Tetra &middot; Hecho para PyMEs venezolanas</p>
    </div>
</body>
</html>
