<!doctype html>
<html lang="es-VE">

<head>
    <title>{% block title %}{% endblock %} - Tetra</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('tetra-theme');
                var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            } catch (e) {}
        })();
    </script>
    <link rel="icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.bunny.net/css?family=sora:400,500,600,700,800|ibm-plex-mono:400,500,600&display=swap">
    <link href="/static/css/app.css" rel="stylesheet">
</head>

<body class="wall">
    <a class="standalone-brand" href="/">
        <svg class="brand-mark" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect width="40" height="40" rx="10" fill="var(--primary)" />
            <path d="M12 11h16v4.5h-5.75V29h-4.5V15.5H12V11z" fill="var(--primary-ink)" />
        </svg>
        Tetra
    </a>

    <main class="standalone">
        <div class="standalone-art" aria-hidden="true">
            <div class="standalone-art-slab"></div>
            <img class="standalone-art-img" src="/static/svg/{% block art_src %}403{% endblock %}.svg" alt="">
        </div>
        <p class="error-code">{% block code %}Oh no{% endblock %}</p>
        <div class="error-bar" aria-hidden="true"></div>
        <p class="error-msg">{% block message %}{% endblock %}</p>
        <div class="standalone-actions">
            <a href="/" class="cta">Volver al inicio</a>
        </div>
    </main>
</body>

</html>
